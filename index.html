.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  const feedback = root.querySelector(&#x27;[data-feedback]&#x27;);

  const packSummary = root.querySelector(&#x27;[data-pack-summary]&#x27;);
  const packs = root.querySelector(&#x27;[data-packs]&#x27;);
  const packPrompt = root.querySelector(&#x27;[data-pack-prompt]&#x27;);
  const packOptions = root.querySelector(&#x27;[data-pack-options]&#x27;);
  const packStage = root.querySelector(&#x27;[data-pack-stage]&#x27;);
  const packFeedback = root.querySelector(&#x27;[data-pack-feedback]&#x27;);
  const packSparkles = root.querySelector(&#x27;[data-pack-sparkles]&#x27;);
  const packTabs = [...root.querySelectorAll(&#x27;[data-pack-mode]&#x27;)];

  const lcmBoard = root.querySelector(&#x27;[data-lcm-board]&#x27;);
  const lcmStage = root.querySelector(&#x27;[data-lcm-stage]&#x27;);
  const lcmFeedback = root.querySelector(&#x27;[data-lcm-feedback]&#x27;);
  const lcmSparkles = root.querySelector(&#x27;[data-lcm-sparkles]&#x27;);
  const lcmTabs = [...root.querySelectorAll(&#x27;[data-lcm-mode]&#x27;)];
  const tabs = [...root.querySelectorAll(&#x27;[data-mode]&#x27;)];
  let question = { length:24, width:18, gcd:6 };
  let mode = &#x27;side&#x27;;
  let packMode = &#x27;count&#x27;;
  let postMode = &#x27;distance&#x27;;
  let lcmMode = &#x27;side&#x27;;
  let difficulty = 0;
  let lastDimensions = {min:0,max:0};
  let selected = null;
  const celebrationTimers = new WeakMap();
  const gcd = (a,b) =&gt; b ? gcd(b,a % b) : a;
  const shuffle = values =&gt; {
    const copy = [...values];
    for (let i=copy.length-1;i&gt;0;i--) { const j=Math.floor(Math.random()*(i+1)); [copy[i],copy[j]]=[copy[j],copy[i]]; }
    return copy;
  };

  function metricFor(side, kind=mode) {
    if (kind===&#x27;side&#x27;) return side;
    const columns=Math.floor(question.length/side);
    const rows=Math.floor(question.width/side);
    return `${columns} × ${rows}`;
  }

  function answerFor(kind=mode) { return metricFor(question.gcd,kind); }

  function buildChoices() {
    const limit=Math.min(question.length,question.width);
    const pool=[];
    for (let side=2;side&lt;=limit;side++) {
      const count=Math.floor(question.length/side)*Math.floor(question.width/side);
      if (count&gt;0 &amp;&amp; count&lt;=120) pool.push(side);
    }
    const correct=question.gcd;
    const seen=new Set([answerFor()]);
    const choices=[{side:correct,label:answerFor()}];
    shuffle(pool.filter(side=&gt;side!==correct)).forEach(side=&gt;{
      const label=metricFor(side);
      if (!seen.has(label) &amp;&amp; choices.length&lt;3) { seen.add(label); choices.push({side,label}); }
    });
    return shuffle(choices);
  }

  function renderOptions({keepBoard=false}={}) {
    selected=null;
    const prompts={
      side:&#x27;哪一個數字是最大正方形的邊長？&#x27;,
      count:&#x27;長邊分割幾塊 × 寬邊分割幾塊？&#x27;
    };
    promptEl.textContent=prompts[mode];
    optionsEl.innerHTML=&#x27;&#x27;;
    buildChoices().forEach(choice=&gt;{
      const button=document.createElement(&#x27;button&#x27;);
      button.type=&#x27;button&#x27;;
      button.className=&#x27;btn gcd-option&#x27;;
      button.textContent=choice.label;
      button.dataset.side=choice.side;
      button.dataset.value=choice.label;
      button.setAttribute(&#x27;aria-label&#x27;,`${choice.label}`);
      button.addEventListener(&#x27;click&#x27;,()=&gt;choose(choice,button));
      optionsEl.appendChild(button);
    });
    feedback.textContent=&#x27;請用肉眼判斷，再按一個數字觀看切割結果。&#x27;;
    if (!keepBoard) drawBoard(null);
  }

  function setStage(nextMode,{keepBoard=false}={}) {
    mode=nextMode;
    tabs.forEach(tab=&gt;{
      const active=tab.dataset.mode===mode;
      tab.hidden=!active;
      tab.classList.toggle(&#x27;active&#x27;,active);
      tab.setAttribute(&#x27;aria-selected&#x27;,String(active));
    });
    const activeTab=tabs.find(tab=&gt;tab.dataset.mode===mode);
    root.querySelector(&#x27;[role=&quot;tabpanel&quot;]&#x27;).setAttribute(&#x27;aria-labelledby&#x27;,activeTab.id);
    renderOptions({keepBoard});
  }

  function playSuccessSound(finalStage) {
    const AudioEngine=window.AudioContext || window.webkitAudioContext;
    if (!AudioEngine) return;
    const context=new AudioEngine();
    const notes=finalStage ? [523.25,659.25,783.99,1046.5] : [523.25,659.25,783.99];
    const start=context.currentTime;
    notes.forEach((frequency,index)=&gt;{
      const oscillator=context.createOscillator();
      const gain=context.createGain();
      const noteStart=start+index*.1;
      oscillator.type=index===notes.length-1?&#x27;sine&#x27;:&#x27;triangle&#x27;;
      oscillator.frequency.setValueAtTime(frequency,noteStart);
      gain.gain.setValueAtTime(.0001,noteStart);
      gain.gain.exponentialRampToValueAtTime(.16,noteStart+.025);
      gain.gain.exponentialRampToValueAtTime(.0001,noteStart+.28);
      oscillator.connect(gain);
      gain.connect(context.destination);
      oscillator.start(noteStart);
      oscillator.stop(noteStart+.3);
    });
    context.resume?.();
    setTimeout(()=&gt;context.close?.(),1000);
  }

  function clearCelebration(targetStage,targetSparkles) {
    const timer=celebrationTimers.get(targetSparkles);
    if (timer) clearTimeout(timer);
    celebrationTimers.delete(targetSparkles);
    targetSparkles.classList.remove(&#x27;is-visible&#x27;);
    targetStage.classList.remove(&#x27;is-celebrating&#x27;);
  }

  function celebrate(finalStage,targetStage=stage,targetSparkles=sparkles) {
    clearCelebration(targetStage,targetSparkles);
    void targetSparkles.offsetWidth;
    targetSparkles.classList.add(&#x27;is-visible&#x27;);
    targetStage.classList.add(&#x27;is-celebrating&#x27;);
    playSuccessSound(finalStage);
    const timer=setTimeout(()=&gt;clearCelebration(targetStage,targetSparkles),1150);
    celebrationTimers.set(targetSparkles,timer);
  }

  function showExample(name) {
    const labels={
      cut:[&#x27;紙張長&#x27;,&#x27;紙張寬&#x27;,&#x27;cm&#x27;],
      pack:[&#x27;藍色物品&#x27;,&#x27;橘色物品&#x27;,&#x27;個&#x27;],
      posts:[&#x27;場地長&#x27;,&#x27;場地寬&#x27;,&#x27;m&#x27;]
    };
    clearCelebration(stage,sparkles);
    clearCelebration(packStage,packSparkles);
    clearCelebration(postStage,postSparkles);
    exampleViews.forEach(view=&gt;view.hidden=view.dataset.example!==name);
    const [first,second,unit]=labels[name];
    lengthLabel.textContent=first;
    widthLabel.textContent=second;
    lengthUnit.textContent=unit;
    widthUnit.textContent=unit;
  }

  function showTopic(topic) {
    const isLcm=topic===&#x27;lcm&#x27;;
    exampleControl.hidden=isLcm;
    lcmHeader.hidden=!isLcm;
    exampleViews.forEach(view=&gt;view.hidden=isLcm || view.dataset.example!==exampleSelect.value);

    if (isLcm) {
      lengthLabel.textContent=&#x27;磁磚長&#x27;;
      widthLabel.textContent=&#x27;磁磚寬&#x27;;

      widthUnit.textContent=&#x27;cm&#x27;;

      widthEl.textContent=&#x27;10&#x27;;

    } else {
      lengthEl.textContent=question.length;
      widthEl.textContent=question.width;
      showExample(exampleSelect.value);
    }
  }

  function renderLcmOptions({keepBoard=false}={}) {
    const choices=lcmMode===&#x27;side&#x27;
      ? shuffle([{value:30,label:&#x27;30 cm&#x27;},{value:20,label:&#x27;20 cm&#x27;},{value:60,label:&#x27;60 cm&#x27;}])
      : shuffle([{value:&#x27;2x3&#x27;,label:&#x27;橫向 2 塊 × 直向 3 塊&#x27;},{value:&#x27;3x2&#x27;,label:&#x27;橫向 3 塊 × 直向 2 塊&#x27;},{value:&#x27;3x3&#x27;,label:&#x27;橫向 3 塊 × 直向 3 塊&#x27;}]);
    lcmPrompt.textContent=lcmMode===&#x27;side&#x27;?&#x27;拼成的最小正方形邊長是多少？&#x27;:&#x27;橫向幾塊 × 直向幾塊？&#x27;;
    lcmOptions.innerHTML=&#x27;&#x27;;
    lcmOptions.classList.toggle(&#x27;is-wide-labels&#x27;,lcmMode===&#x27;count&#x27;);
    choices.forEach(choice=&gt;{
      const button=document.createElement(&#x27;button&#x27;);
      button.type=&#x27;button&#x27;;
      button.className=&#x27;btn gcd-option&#x27;;
      button.textContent=choice.label;
      button.dataset.value=choice.value;
      button.addEventListener(&#x27;click&#x27;,()=&gt;chooseLcm(choice,button));
      lcmOptions.appendChild(button);
    });
    lcmFeedback.textContent=lcmMode===&#x27;side&#x27;
      ? &#x27;請找出同時是 15 和 10 倍數的最小數。&#x27;
      : &#x27;第一關答對！請觀察 30 cm 正方形中的磁磚排列。&#x27;;
    if (!keepBoard) drawLcmBoard(null);
  }

  function setLcmStage(nextMode,{keepBoard=false}={}) {
    lcmMode=nextMode;
    lcmTabs.forEach(tab=&gt;{
      const active=tab.dataset.lcmMode===lcmMode;
      tab.hidden=!active;
      tab.classList.toggle(&#x27;active&#x27;,active);
      tab.setAttribute(&#x27;aria-selected&#x27;,String(active));
    });
    const activeTab=lcmTabs.find(tab=&gt;tab.dataset.lcmMode===lcmMode);
    root.querySelector(&#x27;#lcm-options&#x27;).setAttribute(&#x27;aria-labelledby&#x27;,activeTab.id);
    renderLcmOptions({keepBoard});
  }

  function chooseLcm(choice,button) {
    [...lcmOptions.children].forEach(item=&gt;{
      item.dataset.state=&#x27;&#x27;;
      item.removeAttribute(&#x27;aria-pressed&#x27;);
    });
    const correct=lcmMode===&#x27;side&#x27;?30:&#x27;2x3&#x27;;
    const right=choice.value===correct;
    button.dataset.state=right?&#x27;right&#x27;:&#x27;wrong&#x27;;
    button.setAttribute(&#x27;aria-pressed&#x27;,&#x27;true&#x27;);
    clearCelebration(lcmStage,lcmSparkles);
    if (lcmMode===&#x27;side&#x27;) {
      drawLcmBoard(choice.value);
      if (right) {
        setLcmStage(&#x27;count&#x27;,{keepBoard:true});
        lcmFeedback.textContent=&#x27;第一關答對！最小公倍數 [15, 10]＝30 cm。現在選出磁磚排列。&#x27;;
        celebrate(false,lcmStage,lcmSparkles);
      } else if (choice.value===60) {
        lcmFeedback.textContent=&#x27;60 cm 可以拼成正方形，但不是最小的；請找更小的共同倍數。&#x27;;
      } else {
        lcmFeedback.textContent=&#x27;20 不是 15 的倍數，磁磚會超出邊界，無法完整拼成正方形。&#x27;;
      }
      return;
    }
    drawLcmBoard(30,right);
    if (right) {
      lcmFeedback.textContent=&#x27;兩關都答對！橫向 30 ÷ 15＝2 塊，直向 30 ÷ 10＝3 塊，共 2 × 3＝6 塊。&#x27;;
      celebrate(true,lcmStage,lcmSparkles);
    } else {
      lcmFeedback.textContent=&#x27;再算一次：橫向用正方形邊長除以 15，直向除以 10。&#x27;;
    }
  }

  function drawLcmBoard(side,reveal=false) {
    const viewW=700, viewH=400, x0=205, y0=62, target=270;
    const chosen=side || 30;
    let html=&#x27;&lt;title&gt;長方形磁磚拼成最小正方形&lt;/title&gt;&#x27;;
    html+=&#x27;&lt;desc&gt;每塊磁磚長 15 公分、寬 10 公分，拼成邊長 30 公分的最小正方形。&lt;/desc&gt;&#x27;;
    html+=`&lt;text x=&quot;${viewW/2}&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot;&gt;${side?`試拼正方形邊長：${side} cm`:&#x27;每塊磁磚：15 cm × 10 cm&#x27;}&lt;/text&gt;`;
    if (!side) {
      html+=`&lt;rect x=&quot;${x0+42}&quot; y=&quot;${y0+62}&quot; width=&quot;180&quot; height=&quot;120&quot; rx=&quot;6&quot; fill=&quot;var(--accent)&quot; stroke=&quot;var(--foreground)&quot; stroke-width=&quot;2&quot;/&gt;`;
      html+=`&lt;text x=&quot;${x0+132}&quot; y=&quot;${y0+48}&quot; text-anchor=&quot;middle&quot;&gt;長 15 cm&lt;/text&gt;`;
      html+=`&lt;text x=&quot;${x0+18}&quot; y=&quot;${y0+122}&quot; text-anchor=&quot;middle&quot; transform=&quot;rotate(-90 ${x0+18} ${y0+122})&quot;&gt;寬 10 cm&lt;/text&gt;`;
      html+=`&lt;text x=&quot;${viewW/2}&quot; y=&quot;${viewH-28}&quot; text-anchor=&quot;middle&quot;&gt;先找出 15 和 10 的最小公倍數&lt;/text&gt;`;
    } else if (chosen===30 || chosen===60) {
      const displaySide=chosen===30?target:target;
      const columns=chosen/15, rows=chosen/10;
      const shownColumns=columns, shownRows=rows;
      const cellW=displaySide/shownColumns, cellH=displaySide/shownRows;
      html+=`&lt;rect x=&quot;${x0}&quot; y=&quot;${y0}&quot; width=&quot;${displaySide}&quot; height=&quot;${displaySide}&quot; fill=&quot;var(--accent)&quot; stroke=&quot;var(--foreground)&quot; stroke-width=&quot;3&quot;/&gt;`;
      for (let row=0;row&lt;shownRows;row++) for (let col=0;col&lt;shownColumns;col++) {
        const fill=reveal ? ((row+col)%2?&#x27;var(--viz-series-2)&#x27;:&#x27;var(--viz-series-1)&#x27;) : &#x27;var(--muted)&#x27;;
        html+=`&lt;rect class=&quot;gcd-tile&quot; x=&quot;${x0+col*cellW}&quot; y=&quot;${y0+row*cellH}&quot; width=&quot;${cellW}&quot; height=&quot;${cellH}&quot; fill=&quot;${fill}&quot; fill-opacity=&quot;.42&quot; stroke=&quot;var(--foreground)&quot; stroke-width=&quot;1.5&quot;/&gt;`;
      }
      const note=chosen===30
        ? `橫向 30 ÷ 15＝2 塊｜直向 30 ÷ 10＝3 塊${reveal?&#x27;｜共 6 塊&#x27;:&#x27;&#x27;}`
        : &#x27;60 cm 雖然可以完整拼成，但還不是最小正方形&#x27;;
      html+=`&lt;text x=&quot;${viewW/2}&quot; y=&quot;${viewH-28}&quot; text-anchor=&quot;middle&quot;&gt;${note}&lt;/text&gt;`;
    } else {
      html+=`&lt;rect x=&quot;${x0}&quot; y=&quot;${y0}&quot; width=&quot;${target}&quot; height=&quot;${target}&quot; fill=&quot;var(--accent)&quot; stroke=&quot;var(--foreground)&quot; stroke-width=&quot;3&quot;/&gt;`;
      html+=`&lt;rect x=&quot;${x0}&quot; y=&quot;${y0}&quot; width=&quot;${target*.75}&quot; height=&quot;${target/2}&quot; fill=&quot;var(--destructive)&quot; fill-opacity=&quot;.28&quot; stroke=&quot;var(--foreground)&quot;/&gt;`;
      html+=`&lt;text x=&quot;${viewW/2}&quot; y=&quot;${viewH-28}&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--destructive)&quot;&gt;20 ÷ 15 不能整除，邊界會留下空隙&lt;/text&gt;`;
    }
    lcmBoard.setAttribute(&#x27;viewBox&#x27;,`0 0 ${viewW} ${viewH}`);
    lcmBoard.innerHTML=html;
  }

  function packEachKey(first,second) {
    return `${first}x${second}`;
  }

  function buildPackChoices() {
    if (packMode===&#x27;each&#x27;) {
      const first=question.length/question.gcd;
      const second=question.width/question.gcd;
      const correct=packEachKey(first,second);
      const candidates=[
        [first+1,second],[first,second+1],[Math.max(1,first-1),second],
        [first,Math.max(1,second-1)],[second,first]
      ];
      const seen=new Set([correct]);
      const choices=[{value:correct,first,second,label:`${first} 藍 × ${second} 橘`}];
      shuffle(candidates).forEach(([candidateFirst,candidateSecond])=&gt;{
        const value=packEachKey(candidateFirst,candidateSecond);
        if (!seen.has(value) &amp;&amp; choices.length&lt;3) {
          seen.add(value);
          choices.push({value,first:candidateFirst,second:candidateSecond,label:`${candidateFirst} 藍 × ${candidateSecond} 橘`});
        }
      });
      return shuffle(choices);
    }
    const limit=Math.min(12,question.length,question.width);
    const candidates=[];
    for (let value=2;value&lt;=limit;value++) if (value!==question.gcd) candidates.push(value);
    return shuffle([question.gcd,...shuffle(candidates).slice(0,2)]).map(value=&gt;({value,label:`${value} 包`}));
  }

  function renderPackOptions({keepBoard=false}={}) {
    packPrompt.textContent=packMode===&#x27;count&#x27; ? &#x27;最多可以平均分成幾包？&#x27; : &#x27;每包應該放幾個藍色物品 × 幾個橘色物品？&#x27;;
    packOptions.innerHTML=&#x27;&#x27;;
    packOptions.classList.toggle(&#x27;is-wide-labels&#x27;,packMode===&#x27;each&#x27;);
    buildPackChoices().forEach(choice=&gt;{
      const button=document.createElement(&#x27;button&#x27;);
      button.type=&#x27;button&#x27;;
      button.className=&#x27;btn gcd-option&#x27;;
      button.textContent=choice.label;
      button.dataset.value=choice.value;
      button.addEventListener(&#x27;click&#x27;,()=&gt;choosePack(choice,button));
      packOptions.appendChild(button);
    });
    packFeedback.textContent=packMode===&#x27;count&#x27; ? &#x27;先找出能同時整除兩種物品數量的最大包數。&#x27; : &#x27;第一關已通過！請觀察每包的圓點，再選每包內容。&#x27;;
    if (!keepBoard) drawPacks(null);
  }

  function setPackStage(nextMode,{keepBoard=false}={}) {
    packMode=nextMode;
    packTabs.forEach(tab=&gt;{
      const active=tab.dataset.packMode===packMode;
      tab.hidden=!active;
      tab.classList.toggle(&#x27;active&#x27;,active);
      tab.setAttribute(&#x27;aria-selected&#x27;,String(active));
    });
    const activeTab=packTabs.find(tab=&gt;tab.dataset.packMode===packMode);
    root.querySelector(&#x27;#gcd-pack-options&#x27;).setAttribute(&#x27;aria-labelledby&#x27;,activeTab.id);
    renderPackOptions({keepBoard});
  }

  function choosePack(choice,button) {
    [...packOptions.children].forEach(item=&gt;{
      item.dataset.state=&#x27;&#x27;;
      item.removeAttribute(&#x27;aria-pressed&#x27;);
    });
    const correct=packMode===&#x27;count&#x27;
      ? question.gcd
      : packEachKey(question.length/question.gcd,question.width/question.gcd);
    const right=choice.value===correct;
    button.dataset.state=right?&#x27;right&#x27;:&#x27;wrong&#x27;;
    button.setAttribute(&#x27;aria-pressed&#x27;,&#x27;true&#x27;);
    packSparkles.classList.remove(&#x27;is-visible&#x27;);
    packStage.classList.remove(&#x27;is-celebrating&#x27;);
    if (packMode===&#x27;count&#x27;) {
      drawPacks(choice.value);
      if (right) {
        setPackStage(&#x27;each&#x27;,{keepBoard:true});
        packFeedback.textContent=`第一關答對！最多分成 ${question.gcd} 包。物品顏色尚未揭曉，請先計算每包內容。`;
        celebrate(false,packStage,packSparkles);
      } else if (question.length%choice.value===0 &amp;&amp; question.width%choice.value===0) {
        packFeedback.textContent=`${choice.value} 包可以平均分裝，但還不是最多包。`;
      } else {
        packFeedback.textContent=`分成 ${choice.value} 包會有物品剩下，無法讓每包完全相同。`;
      }
      return;
    }
    drawPacks(question.gcd,right);
    if (right) {
      const first=question.length/question.gcd, second=question.width/question.gcd;
      packSummary.textContent=`${question.length} 個藍色和 ${question.width} 個橘色，最多分成 ${question.gcd} 包。`;
      packFeedback.textContent=`兩關都答對！每包 ${first} 個藍色 × ${second} 個橘色，共 ${question.gcd} 包。`;
      celebrate(true,packStage,packSparkles);
    } else {
      packFeedback.textContent=&#x27;再算一次：每包數量＝物品總數 ÷ 最多包數，兩種物品都要剛好分完。&#x27;;
    }
  }

  function drawPacks(packageCount=null,revealColors=false) {
    if (!packageCount) {
      packs.innerHTML=&#x27;&#x27;;
      return;
    }
    const perFirst=Math.floor(question.length/packageCount);
    const perSecond=Math.floor(question.width/packageCount);
    const complete=question.length%packageCount===0 &amp;&amp; question.width%packageCount===0;
    const firstClass=revealColors?&#x27;gcd-dot&#x27;:&#x27;gcd-dot is-concealed&#x27;;
    const secondClass=revealColors?&#x27;gcd-dot is-second&#x27;:&#x27;gcd-dot is-concealed&#x27;;
    packs.innerHTML=Array.from({length:packageCount},(_,index)=&gt;{
      const firstDots=`&lt;span class=&quot;${firstClass}&quot;&gt;&lt;/span&gt;`.repeat(perFirst);
      const secondDots=`&lt;span class=&quot;${secondClass}&quot;&gt;&lt;/span&gt;`.repeat(perSecond);
      const label=revealColors ? `第 ${index+1} 包：${perFirst} 個藍色物品、${perSecond} 個橘色物品` : `第 ${index+1} 包：內容顏色尚未揭曉`;
      return `&lt;div class=&quot;gcd-pack&quot; role=&quot;img&quot; aria-label=&quot;${label}&quot;&gt;&lt;strong&gt;第 ${index+1} 包&lt;/strong&gt;&lt;div class=&quot;gcd-pack-dots&quot;&gt;${firstDots}${secondDots}&lt;/div&gt;&lt;/div&gt;`;
    }).join(&#x27;&#x27;);
    if (!complete) packs.insertAdjacentHTML(&#x27;beforeend&#x27;,`&lt;div class=&quot;gcd-pack&quot; role=&quot;note&quot;&gt;&lt;strong&gt;有剩餘物品&lt;/strong&gt;&lt;div class=&quot;gcd-pack-dots&quot;&gt;&lt;span class=&quot;${firstClass}&quot;&gt;&lt;/span&gt;&lt;span class=&quot;${secondClass}&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;`);
  }

  function postCount(distance=question.gcd) {
    return 2*(question.length/distance+question.width/distance);
  }

  function buildPostChoices() {
    if (postMode===&#x27;count&#x27;) {
      const correct=postCount();
      const candidates=[correct-4,correct+4,correct-2,correct+2,correct-6,correct+6].filter(value=&gt;value&gt;4 &amp;&amp; value!==correct);
      return shuffle([correct,...shuffle(candidates).slice(0,2)]).map(value=&gt;({value,label:`${value} 根`}));
    }
    const limit=Math.min(question.length,question.width);
    const candidates=[];
    for (let value=2;value&lt;=limit;value++) if (value!==question.gcd) candidates.push(value);
    return shuffle([question.gcd,...shuffle(candidates).slice(0,2)]).map(value=&gt;({value,label:`${value} m`}));
  }

  function renderPostOptions({keepBoard=false}={}) {
    postPrompt.textContent=postMode===&#x27;distance&#x27; ? &#x27;哪一個數字是最大的柱距？&#x27; : &#x27;沿著場地四周，一共需要幾根柱子？&#x27;;
    postOptions.innerHTML=&#x27;&#x27;;
    buildPostChoices().forEach(choice=&gt;{
      const button=document.createElement(&#x27;button&#x27;);
      button.type=&#x27;button&#x27;;
      button.className=&#x27;btn gcd-option&#x27;;
      button.textContent=choice.label;
      button.dataset.value=choice.value;
      button.addEventListener(&#x27;click&#x27;,()=&gt;choosePost(choice,button));
      postOptions.appendChild(button);
    });
    postFeedback.textContent=postMode===&#x27;distance&#x27; ? &#x27;先找出能同時整除場地長與寬的最大柱距。&#x27; : &#x27;第一關已通過！請觀察圖上的柱子，再選柱子總數。&#x27;;
    if (!keepBoard) drawPosts(null);
  }

  function hidePostSolution() {
    postSolution.hidden=true;
    postSolution.innerHTML=&#x27;&#x27;;
    postStage.classList.remove(&#x27;has-solution&#x27;);
  }

  function setPostStage(nextMode,{keepBoard=false}={}) {
    postMode=nextMode;
    hidePostSolution();
    postTabs.forEach(tab=&gt;{
      const active=tab.dataset.postMode===postMode;
      tab.hidden=!active;
      tab.classList.toggle(&#x27;active&#x27;,active);
      tab.setAttribute(&#x27;aria-selected&#x27;,String(active));
    });
    const activeTab=postTabs.find(tab=&gt;tab.dataset.postMode===postMode);
    root.querySelector(&#x27;#gcd-post-options&#x27;).setAttribute(&#x27;aria-labelledby&#x27;,activeTab.id);
    renderPostOptions({keepBoard});
  }

  function choosePost(choice,button) {
    [...postOptions.children].forEach(item=&gt;{
      item.dataset.state=&#x27;&#x27;;
      item.removeAttribute(&#x27;aria-pressed&#x27;);
    });
    const correct=postMode===&#x27;distance&#x27; ? question.gcd : postCount();
    const right=choice.value===correct;
    button.dataset.state=right?&#x27;right&#x27;:&#x27;wrong&#x27;;
    button.setAttribute(&#x27;aria-pressed&#x27;,&#x27;true&#x27;);
    postSparkles.classList.remove(&#x27;is-visible&#x27;);
    postStage.classList.remove(&#x27;is-celebrating&#x27;);
    lcmSparkles.classList.remove(&#x27;is-visible&#x27;);
    lcmStage.classList.remove(&#x27;is-celebrating&#x27;);
    hidePostSolution();
    if (postMode===&#x27;distance&#x27;) {
      drawPosts(choice.value);
      if (right) {
        setPostStage(&#x27;count&#x27;,{keepBoard:true});
        postFeedback.textContent=`第一關答對！最大柱距是 ${question.gcd} m。現在請數出四周的柱子總數。`;
        celebrate(false,postStage,postSparkles);
      } else if (question.length%choice.value===0 &amp;&amp; question.width%choice.value===0) {
        postFeedback.textContent=`${choice.value} m 可以等距設柱，但還不是最大的共同距離。`;
      } else {
        postFeedback.textContent=`${choice.value} m 不能同時整除 ${question.length} m 和 ${question.width} m，邊尾會剩下一段。`;
      }
      return;
    }
    drawPosts(question.gcd,true);
    if (right) {
      const columns=question.length/question.gcd, rows=question.width/question.gcd;
      postSummary.textContent=`最大柱距 ${question.gcd} m；長邊各 ${columns} 段、寬邊各 ${rows} 段。`;
      postFeedback.textContent=`兩關都答對！四周共設 ${postCount()} 根柱。`;
      postSolution.innerHTML=`&lt;strong&gt;解法&lt;/strong&gt;&lt;ol&gt;&lt;li&gt;長邊間隔數：${question.length} ÷ ${question.gcd}＝${columns}&lt;/li&gt;&lt;li&gt;寬邊間隔數：${question.width} ÷ ${question.gcd}＝${rows}&lt;/li&gt;&lt;li&gt;兩條長邊：${columns}＋${columns}＝${columns*2}&lt;/li&gt;&lt;li&gt;兩條寬邊：${rows}＋${rows}＝${rows*2}&lt;/li&gt;&lt;li&gt;柱子總數：${columns*2}＋${rows*2}＝${postCount()} 根&lt;/li&gt;&lt;/ol&gt;`;
      postSolution.hidden=false;
      postStage.classList.add(&#x27;has-solution&#x27;);
      celebrate(true,postStage,postSparkles);
    } else {
      postFeedback.textContent=&#x27;再數一次：四個轉角只各算一根，可以用「長邊段數＋寬邊段數」乘以 2。&#x27;;
    }
  }

  function renderApplications() {
    packSummary.textContent=&#x27;把兩種物品平均分裝，每包的內容都要完全相同，而且不能剩下。&#x27;;
    drawPacks(null);
    postSummary.textContent=&#x27;沿著長方形場地四周，以相同距離設柱，轉角也要有柱子。&#x27;;
    drawPosts(null);
  }

  function drawPosts(distance=null,showCount=false) {
    const {length,width}=question;
    const columns=distance ? Math.floor(length/distance) : 0;
    const rows=distance ? Math.floor(width/distance) : 0;
    const complete=distance &amp;&amp; length%distance===0 &amp;&amp; width%distance===0;
    const total=complete ? 2*(columns+rows) : null;
    const viewW=520, viewH=270, maxW=350, maxH=150;
    const scale=Math.min(maxW/length,maxH/width);
    const w=length*scale, h=width*scale, x0=(viewW-w)/2, y0=58;
    let marks=`&lt;title&gt;場地等距設柱&lt;/title&gt;&lt;desc&gt;長 ${length} 公尺、寬 ${width} 公尺${distance?`，嘗試每隔 ${distance} 公尺設一根柱`:&#x27;，等待選擇柱距&#x27;}。&lt;/desc&gt;`;
    marks+=`&lt;rect x=&quot;${x0}&quot; y=&quot;${y0}&quot; width=&quot;${w}&quot; height=&quot;${h}&quot; rx=&quot;6&quot; fill=&quot;var(--accent)&quot; stroke=&quot;var(--foreground)&quot; stroke-width=&quot;2&quot;/&gt;`;
    marks+=`&lt;text x=&quot;${x0+w/2}&quot; y=&quot;${y0-22}&quot; text-anchor=&quot;middle&quot;&gt;長 ${length} m${distance?`｜試設柱距 ${distance} m`:&#x27;&#x27;}&lt;/text&gt;`;
    marks+=`&lt;text x=&quot;${x0-26}&quot; y=&quot;${y0+h/2}&quot; text-anchor=&quot;middle&quot; transform=&quot;rotate(-90 ${x0-26} ${y0+h/2})&quot;&gt;寬 ${width} m&lt;/text&gt;`;
    if (distance) {
      for (let i=0;i&lt;=columns;i++) {
        const x=x0+i*distance*scale;
        marks+=`&lt;circle cx=&quot;${x}&quot; cy=&quot;${y0}&quot; r=&quot;6&quot; fill=&quot;${complete?&#x27;var(--green)&#x27;:&#x27;var(--destructive)&#x27;}&quot;/&gt;&lt;circle cx=&quot;${x}&quot; cy=&quot;${y0+h}&quot; r=&quot;6&quot; fill=&quot;${complete?&#x27;var(--green)&#x27;:&#x27;var(--destructive)&#x27;}&quot;/&gt;`;
      }
      for (let i=1;i&lt;rows;i++) {
        const y=y0+i*distance*scale;
        marks+=`&lt;circle cx=&quot;${x0}&quot; cy=&quot;${y}&quot; r=&quot;6&quot; fill=&quot;${complete?&#x27;var(--green)&#x27;:&#x27;var(--destructive)&#x27;}&quot;/&gt;&lt;circle cx=&quot;${x0+w}&quot; cy=&quot;${y}&quot; r=&quot;6&quot; fill=&quot;${complete?&#x27;var(--green)&#x27;:&#x27;var(--destructive)&#x27;}&quot;/&gt;`;
      }
      if (!complete) marks+=`&lt;text x=&quot;${viewW/2}&quot; y=&quot;${viewH-18}&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--destructive)&quot;&gt;邊尾會剩下一段，無法保持等距&lt;/text&gt;`;
      else if (showCount) marks+=`&lt;text x=&quot;${viewW/2}&quot; y=&quot;${viewH-18}&quot; text-anchor=&quot;middle&quot;&gt;四周共有 ${total} 根柱&lt;/text&gt;`;
      else marks+=`&lt;text x=&quot;${viewW/2}&quot; y=&quot;${viewH-18}&quot; text-anchor=&quot;middle&quot;&gt;柱距 ${distance} m 可以繞完整個場地&lt;/text&gt;`;
    } else {
      [[x0,y0],[x0+w,y0],[x0,y0+h],[x0+w,y0+h]].forEach(([x,y])=&gt;{
        marks+=`&lt;circle cx=&quot;${x}&quot; cy=&quot;${y}&quot; r=&quot;6&quot; fill=&quot;var(--muted-foreground)&quot;/&gt;`;
      });
      marks+=`&lt;text x=&quot;${viewW/2}&quot; y=&quot;${viewH-18}&quot; text-anchor=&quot;middle&quot;&gt;先選出最大的等距柱距&lt;/text&gt;`;
    }
    posts.setAttribute(&#x27;viewBox&#x27;,`0 0 ${viewW} ${viewH}`);
    posts.innerHTML=marks;
  }

  function choose(choice,button) {
    selected=choice;
    [...optionsEl.children].forEach(item=&gt;{
      item.dataset.state=&#x27;&#x27;;
      item.removeAttribute(&#x27;aria-pressed&#x27;);
    });
    const right=choice.label===answerFor();
    button.dataset.state=right?&#x27;right&#x27;:&#x27;wrong&#x27;;
    button.setAttribute(&#x27;aria-pressed&#x27;,&#x27;true&#x27;);
    drawBoard(choice.side);
    const {length,width}=question;
    const side=choice.side;
    const columns=Math.floor(length/side), rows=Math.floor(width/side);
    const complete=length%side===0 &amp;&amp; width%side===0;
    sparkles.classList.remove(&#x27;is-visible&#x27;);
    stage.classList.remove(&#x27;is-celebrating&#x27;);
    if (right) {
      if (mode===&#x27;side&#x27;) {
        setStage(&#x27;count&#x27;,{keepBoard:true});
        feedback.textContent=&#x27;第一關答對！請觀察切割結果，完成正方形總數。&#x27;;
        celebrate(false);
      } else {
        feedback.textContent=`兩關都答對！GCD(${length}, ${width})＝${question.gcd}；長邊 ${columns} 塊 × 寬邊 ${rows} 塊＝共 ${columns*rows} 塊。`;
        celebrate(true);
      }
    } else if (complete) {
      feedback.textContent=`這個切法能切完，但 ${side} cm 還不是最大的；找找看更大的共同因數。`;
    } else {
      feedback.textContent=`會留下斜線區域，表示 ${side} cm 不能同時整除 ${length} 和 ${width}。`;
    }
  }

  function drawBoard(side) {
    const {length,width}=question;
    const viewW=720, viewH=390, maxW=540, maxH=245;
    const scale=Math.min(maxW/length,maxH/width);
    const w=length*scale, h=width*scale, x0=(viewW-w)/2, y0=64;
    let html=&#x27;&lt;title id=&quot;gcd-board-title&quot;&gt;俯視紙張切割圖&lt;/title&gt;&#x27;;
    html+=`&lt;desc id=&quot;gcd-board-desc&quot;&gt;長 ${length} 公分、寬 ${width} 公分的紙張${side?`，以邊長 ${side} 公分的正方形試切`:&#x27;，等待選擇切割數字&#x27;}。&lt;/desc&gt;`;
    html+=&#x27;&lt;defs&gt;&lt;pattern id=&quot;gcd-hatch&quot; width=&quot;9&quot; height=&quot;9&quot; patternUnits=&quot;userSpaceOnUse&quot; patternTransform=&quot;rotate(30)&quot;&gt;&lt;rect width=&quot;9&quot; height=&quot;9&quot; fill=&quot;var(--muted)&quot;/&gt;&lt;line x1=&quot;0&quot; y1=&quot;0&quot; x2=&quot;0&quot; y2=&quot;9&quot; stroke=&quot;var(--destructive)&quot; stroke-width=&quot;3&quot;/&gt;&lt;/pattern&gt;&lt;/defs&gt;&#x27;;
    html+=`&lt;rect x=&quot;${x0+7}&quot; y=&quot;${y0+9}&quot; width=&quot;${w}&quot; height=&quot;${h}&quot; fill=&quot;var(--muted)&quot; opacity=&quot;.5&quot;/&gt;`;
    html+=`&lt;rect x=&quot;${x0}&quot; y=&quot;${y0}&quot; width=&quot;${w}&quot; height=&quot;${h}&quot; fill=&quot;var(--accent)&quot; stroke=&quot;var(--foreground)&quot; stroke-width=&quot;1.5&quot;/&gt;`;
    html+=`&lt;text x=&quot;${x0+w/2}&quot; y=&quot;${y0-24}&quot; text-anchor=&quot;middle&quot;&gt;長 ${length} cm&lt;/text&gt;`;
    html+=`&lt;text x=&quot;${x0-30}&quot; y=&quot;${y0+h/2}&quot; text-anchor=&quot;middle&quot; transform=&quot;rotate(-90 ${x0-30} ${y0+h/2})&quot;&gt;寬 ${width} cm&lt;/text&gt;`;
    if (side) {
      const cols=Math.floor(length/side), rows=Math.floor(width/side);
      const cell=side*scale;
      let number=1;
      for (let row=0;row&lt;rows;row++) for (let col=0;col&lt;cols;col++) {
        const delay=Math.min((row*cols+col)*18,420);
        const tx=x0+col*cell, ty=y0+row*cell;
        html+=`&lt;rect class=&quot;gcd-tile&quot; style=&quot;animation-delay:${delay}ms&quot; x=&quot;${tx}&quot; y=&quot;${ty}&quot; width=&quot;${cell}&quot; height=&quot;${cell}&quot; fill=&quot;var(--viz-series-1)&quot; fill-opacity=&quot;.24&quot; stroke=&quot;var(--foreground)&quot; stroke-opacity=&quot;.55&quot;/&gt;`;
        if (cols*rows&lt;=36) {
          html+=`&lt;text class=&quot;gcd-tile&quot; style=&quot;animation-delay:${delay}ms&quot; x=&quot;${tx+cell/2}&quot; y=&quot;${ty+cell/2+5}&quot; text-anchor=&quot;middle&quot;&gt;${number}&lt;/text&gt;`;
        }
        number++;
      }
      const usedW=cols*cell, usedH=rows*cell;
      if (length%side) {
        html+=`&lt;rect x=&quot;${x0+usedW}&quot; y=&quot;${y0}&quot; width=&quot;${w-usedW}&quot; height=&quot;${h}&quot; fill=&quot;url(#gcd-hatch)&quot; opacity=&quot;.78&quot;/&gt;`;
      }
      if (width%side &amp;&amp; usedW&gt;0) {
        html+=`&lt;rect x=&quot;${x0}&quot; y=&quot;${y0+usedH}&quot; width=&quot;${usedW}&quot; height=&quot;${h-usedH}&quot; fill=&quot;url(#gcd-hatch)&quot; opacity=&quot;.78&quot;/&gt;`;
      }
      for (let col=1;col&lt;cols;col++) {
        const x=x0+col*cell;
        html+=`&lt;line class=&quot;gcd-cut-line&quot; x1=&quot;${x}&quot; y1=&quot;${y0}&quot; x2=&quot;${x}&quot; y2=&quot;${y0+usedH}&quot;/&gt;`;
      }
      for (let row=1;row&lt;rows;row++) {
        const y=y0+row*cell;
        html+=`&lt;line class=&quot;gcd-cut-line&quot; x1=&quot;${x0}&quot; y1=&quot;${y}&quot; x2=&quot;${x0+usedW}&quot; y2=&quot;${y}&quot;/&gt;`;
      }
      html+=`&lt;text x=&quot;${viewW/2}&quot; y=&quot;${viewH-18}&quot; text-anchor=&quot;middle&quot;&gt;試切：正方形邊長 ${side} cm&lt;/text&gt;`;
    }
    board.setAttribute(&#x27;viewBox&#x27;,`0 0 ${viewW} ${viewH}`);
    board.innerHTML=html;
  }

  function newQuestion() {
    sparkles.classList.remove(&#x27;is-visible&#x27;);
    stage.classList.remove(&#x27;is-celebrating&#x27;);
    packSparkles.classList.remove(&#x27;is-visible&#x27;);
    packStage.classList.remove(&#x27;is-celebrating&#x27;);
    postSparkles.classList.remove(&#x27;is-visible&#x27;);
    postStage.classList.remove(&#x27;is-celebrating&#x27;);
    hidePostSolution();
    const levels=[
      {questions:[[4,6],[6,8],[6,9]],label:&#x27;啟蒙&#x27;},
      {questions:[[12,15],[12,16],[14,18]],label:&#x27;入門&#x27;},
      {questions:[[20,24],[21,28],[24,30]],label:&#x27;基礎&#x27;},
      {questions:[[30,36],[32,40],[35,42]],label:&#x27;熟練&#x27;},
      {questions:[[40,48],[42,49],[45,50]],label:&#x27;進階&#x27;},
      {questions:[[50,60],[54,63],[56,64]],label:&#x27;應用&#x27;},
      {questions:[[63,70],[64,72],[66,78]],label:&#x27;挑戰&#x27;},
      {questions:[[70,80],[72,81],[75,90]],label:&#x27;困難&#x27;},
      {questions:[[80,90],[84,98],[81,99]],label:&#x27;菁英&#x27;},
      {questions:[[90,100],[91,98],[96,100]],label:&#x27;高手&#x27;}
    ];
    difficulty=Math.min(difficulty+1,levels.length);
    const level=levels[difficulty-1];
    const candidates=level.questions.map(dimensions=&gt;({
      dimensions,
      min:Math.min(...dimensions),
      max:Math.max(...dimensions)
    }));
    const harder=candidates.filter(candidate=&gt;candidate.min&gt;lastDimensions.min &amp;&amp; candidate.max&gt;lastDimensions.max);
    const source=harder.length ? harder : candidates;
    const selectedQuestion=source[Math.floor(Math.random()*source.length)];
    const pair=selectedQuestion.dimensions;
    const swap=Math.random()&lt;.5;
    question={length:pair[swap?1:0],width:pair[swap?0:1],gcd:gcd(pair[0],pair[1])};
    lastDimensions={min:Math.min(question.length,question.width),max:Math.max(question.length,question.width)};
    difficultyEl.textContent=&#x27;★&#x27;.repeat(difficulty);
    difficultyLabel.textContent=`第 ${difficulty} 級／10・${level.label}`;
    lengthEl.textContent=question.length;
    widthEl.textContent=question.width;
    lengthEl.animate?.([{transform:&#x27;translateY(-8px)&#x27;,opacity:.2},{transform:&#x27;translateY(0)&#x27;,opacity:1}],{duration:360,easing:&#x27;ease-out&#x27;});
    widthEl.animate?.([{transform:&#x27;translateY(8px)&#x27;,opacity:.2},{transform:&#x27;translateY(0)&#x27;,opacity:1}],{duration:360,easing:&#x27;ease-out&#x27;});
    renderApplications();
    setStage(&#x27;side&#x27;);
    setPackStage(&#x27;count&#x27;);
    setPostStage(&#x27;distance&#x27;);
  }

  topicSelect.addEventListener(&#x27;change&#x27;,()=&gt;showTopic(topicSelect.value));
  exampleSelect.addEventListener(&#x27;change&#x27;,()=&gt;showExample(exampleSelect.value));
  root.querySelector(&#x27;[data-new-question]&#x27;).addEventListener(&#x27;click&#x27;,newQuestion);
  newQuestion();
  showTopic(topicSelect.value);
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }

  };
  const setDescribedBy = (trigger, described) =&gt; {

    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
